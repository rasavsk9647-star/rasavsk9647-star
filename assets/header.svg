<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .f{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .fade{opacity:0;animation:in .6s ease forwards}
      @keyframes in{to{opacity:1}}
      .l1{animation-delay:.2s}.l2{animation-delay:.5s}.l3{animation-delay:.8s}.l4{animation-delay:1.1s}.l5{animation-delay:1.4s}.l6{animation-delay:1.7s}.l7{animation-delay:2s}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:fl 6s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="#ff8a3d"/>

  <g class="f">
    <text x="60" y="78" font-size="15" font-weight="700" letter-spacing="3" fill="#ffb07a" class="fade l1">FRONTEND DEVELOPER · 2.5+ YEARS</text>
    <text x="58" y="138" font-size="46" font-weight="800" fill="#ffffff" class="fade l2">Golam Misba Uddin Sekh</text>
    <text x="60" y="180" font-size="21" fill="#a9b7d0" class="fade l3">I build SaaS web apps, admin panels &amp; mobile apps</text>
    <text x="60" y="208" font-size="21" fill="#a9b7d0" class="fade l3">that real businesses use every day.</text>
    <g class="fade l4">
      <rect x="60" y="238" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="112" y="261" font-size="15" font-weight="600" fill="#dbe5f7" text-anchor="middle">React.js</text>
      <rect x="174" y="238" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="222" y="261" font-size="15" font-weight="600" fill="#dbe5f7" text-anchor="middle">Next.js</text>
      <rect x="280" y="238" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="348" y="261" font-size="15" font-weight="600" fill="#dbe5f7" text-anchor="middle">React Native</text>
      <rect x="426" y="238" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="485" y="261" font-size="15" font-weight="600" fill="#dbe5f7" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <g class="float">
    <rect x="700" y="46" width="450" height="228" rx="14" fill="#0e1729" stroke="#2a3754"/>
    <rect x="700" y="46" width="450" height="36" rx="14" fill="#16223b"/>
    <rect x="700" y="68" width="450" height="14" fill="#16223b"/>
    <circle cx="724" cy="64" r="6" fill="#ff5f57"/><circle cx="744" cy="64" r="6" fill="#febc2e"/><circle cx="764" cy="64" r="6" fill="#28c840"/>
    <text x="925" y="69" font-size="13" fill="#7f8db0" text-anchor="middle" class="f">misba.tsx</text>
    <g class="m" font-size="15">
      <text x="724" y="112" class="fade l2"><tspan fill="#c792ea">const</tspan><tspan fill="#ffffff"> misba</tspan><tspan fill="#89ddff"> = {</tspan></text>
      <text x="748" y="138" class="fade l3"><tspan fill="#a9b7d0">role:</tspan><tspan fill="#c3e88d"> "Frontend Developer"</tspan><tspan fill="#89ddff">,</tspan></text>
      <text x="748" y="164" class="fade l4"><tspan fill="#a9b7d0">builds:</tspan><tspan fill="#89ddff"> [</tspan><tspan fill="#c3e88d">"SaaS"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"ERP"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"Apps"</tspan><tspan fill="#89ddff">],</tspan></text>
      <text x="748" y="190" class="fade l5"><tspan fill="#a9b7d0">projects:</tspan><tspan fill="#c3e88d"> "50+"</tspan><tspan fill="#89ddff">,</tspan></text>
      <text x="748" y="216" class="fade l6"><tspan fill="#a9b7d0">openToWork:</tspan><tspan fill="#ff8a3d"> true</tspan><tspan fill="#89ddff">,</tspan></text>
      <text x="724" y="242" class="fade l7"><tspan fill="#89ddff">};</tspan><tspan fill="#ff8a3d" class="cur"> ▍</tspan></text>
    </g>
  </g>
</svg>
